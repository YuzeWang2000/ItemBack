packages:
  - apps/*
  - packages/*

supportedArchitectures:
  os:
    - win32
  cpu:
    - x64

allowBuilds:
  '@embedded-postgres/windows-x64': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  embedded-postgres: true
  prisma: true
  unrs-resolver: true
