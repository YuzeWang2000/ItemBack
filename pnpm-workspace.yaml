packages:
  - apps/*
  - packages/*

# Production maintenance scripts only call Bash and Docker. Do not implicitly
# install the entire development workspace before running them.
verifyDepsBeforeRun: false

allowBuilds:
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  embedded-postgres: true
  prisma: true
  unrs-resolver: true
